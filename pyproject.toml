[project]
name = "vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coremltools>=9.0",
    "kaggle>=2.2.4",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.182",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
